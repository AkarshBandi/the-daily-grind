testimonials:
  heading: Customer testimonials
  text: Come for the coffee. Stay for the moment.
  items:
    - quote: The espresso is the best in the neighborhood. No argument.
      stars: 5
      avatar: /img/avatar-0.webp
      name: Maya Chen
      role: Regular
    - quote: 'A clean, bright room where a man can sit alone with a paper and not be bothered.'
      stars: 5
      avatar: /img/avatar-1.webp
      name: Daniel Brooks
      role: Local writer
    - quote: The sourdough toast with eggs is honest food. It does not pretend.
      stars: 5
      avatar: /img/avatar-2.webp
      name: Sarah Kim
      role: Brunch regular
faq:
  heading: FAQs
  text: Find quick answers about your visit to Hearth & Honey
  items:
    - q: What are your hours?
      a: We are open Monday through Friday from 7 am to 4 pm. Weekends we open at 8 am and close at 3 pm.
    - q: Do you have Wi-Fi?
      a: 'Yes, the Wi-Fi is free and fast. Bring your laptop and settle in.'
    - q: Do you offer vegan options?
      a: We always have oat and almond milk for coffee. The kitchen keeps a few vegan dishes on the menu each day.
    - q: Do I need a reservation?
      a: 'Walk-ins are always welcome. For groups of six or more, a quick call ahead helps us save you a table.'
    - q: Is there gluten-free food?
      a: We bake a gluten-free banana bread most mornings. Ask at the counter for what is available that day.
  still_heading: Still have questions?
  still_text: Haven't found what you're looking for? Our team is happy to help — ask us anything.
  still_button: Get in Touch
