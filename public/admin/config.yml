backend:
  name: github
  repo: "AkarshBandi/the-daily-grind"
  branch: master
  base_url: "https://hearth-honey-auth.akarshbandi82.workers.dev"
  auth_endpoint: "auth"

site_url: "https://the-daily-grind-7y2.pages.dev"
display_url: "https://the-daily-grind-7y2.pages.dev"
logo_url: "/favicon.svg"
publish_mode: editorial_workflow
show_preview_links: true
local_backend: true
search: true

media_folder: "public/shots"
public_folder: "/shots"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "site"
    label: "Site Settings"
    files:
      - label: "General"
        name: "general"
        file: "src/content/site/general.yaml"
        fields:
          - { label: "Site Title", name: "site_title", widget: "string", default: "Hearth & Honey" }
          - { label: "Tagline", name: "tagline", widget: "string", default: "Your neighborhood spot for coffee and good company" }
          - { label: "Description", name: "description", widget: "text", default: "We serve specialty coffee, fresh pastries, and all-day breakfast in a warm, modern space." }
          - { label: "Contact Email", name: "contact_email", widget: "string", default: "hello@hearthandhoney.example" }
  - name: "home"
    label: "Home — Landing"
    label_singular: "Home"
    description: "Hearth & Honey landing — live visual preview. Edit hero, header, menu. Like Elementor."
    files:
      - label: "Home"
        name: "home"
        file: "src/content/pages/home.yaml"
        preview_path: "/"
        fields:
          - { label: "SEO Title", name: "seo_title", widget: "string", default: "Hearth & Honey — Your neighborhood spot for coffee and good company" }
          - { label: "Hero Heading", name: "hero_heading", widget: "string", default: "Your neighborhood spot for coffee and good company" }
          - { label: "Hero Text", name: "hero_text", widget: "text", default: "We serve specialty coffee, fresh pastries, and all-day breakfast in a warm, modern space. Come in, sit down, and stay awhile." }
          - label: "Hero Buttons"
            name: "hero_buttons"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Href", name: "href", widget: "string" }
          - label: "Navbar Links"
            name: "navbar_links"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Href", name: "href", widget: "string" }
              - label: "Dropdown"
                name: "dropdown"
                widget: "list"
                required: false
                fields:
                  - { label: "Item", name: "item", widget: "string" }
          - { label: "About Heading", name: "about_heading", widget: "string", default: "A good café is a clean, well-lighted place" }
          - { label: "About Text", name: "about_text", widget: "text", default: "We built Hearth & Honey to be simple and true. Good coffee, honest food, and a room that feels right." }
          - label: "Banner"
            name: "banner"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Enabled", name: "enabled", widget: "boolean", default: true }
              - { label: "Heading", name: "heading", widget: "string", default: "Fresh pastries are half off after 3 pm" }
              - { label: "Text", name: "text", widget: "string", default: "Join the list for the daily special" }
              - { label: "Placeholder", name: "placeholder", widget: "string", default: "Enter your email" }
              - { label: "Button", name: "button", widget: "string", default: "Sign up" }
          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Tagline", name: "tagline", widget: "string", default: "About" }
              - { label: "Heading", name: "heading", widget: "string", default: "A good café is a clean, well-lighted place" }
              - { label: "Text", name: "text", widget: "text", default: "We built Hearth & Honey to be simple and true. Good coffee, honest food, and a room that feels right." }
              - { label: "Image", name: "image", widget: "image", required: false }
          - label: "Menu Section"
            name: "menu"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string", default: "Menu" }
              - { label: "Heading", name: "heading", widget: "string", default: "What we do well" }
              - { label: "Text", name: "text", widget: "text", default: "A few things we make every day. They are simple and they are good." }
              - label: "Tabs"
                name: "tabs"
                widget: "list"
                max: 6
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Tag", name: "tag", widget: "string" }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
                  - { label: "Image", name: "image", widget: "image", required: false }
          - label: "Testimonials Section"
            name: "testimonials"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string", default: "Customer testimonials" }
              - { label: "Text", name: "text", widget: "string", default: "Come for the coffee. Stay for the moment." }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Quote", name: "quote", widget: "text" }
                  - { label: "Stars", name: "stars", widget: "number", value_type: int, min: 1, max: 5, default: 5 }
                  - { label: "Avatar", name: "avatar", widget: "image", required: false }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Role", name: "role", widget: "string" }
          - label: "FAQ Section"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string", default: "FAQs" }
              - { label: "Text", name: "text", widget: "string", default: "Find quick answers about your visit to Hearth & Honey" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Q", name: "q", widget: "string" }
                  - { label: "A", name: "a", widget: "text" }
          - label: "Contact Section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Tagline", name: "tagline", widget: "string", default: "Visit Us" }
              - { label: "Heading", name: "heading", widget: "string", default: "Contact us" }
              - { label: "Text", name: "text", widget: "text", default: "Find us on Hearth Lane — open daily from 7am. Drop in, call ahead, or send a note." }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Text", name: "text", widget: "string" }
                  - { label: "Link", name: "link", widget: "string", required: false }
                  - { label: "Link Text", name: "link_text", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
          - label: "CTA Section"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string", default: "See you at the counter" }
              - { label: "Text", name: "text", widget: "text", default: "Stop by for a coffee or stay for brunch. The kettle is on and the door is open." }
              - { label: "Image", name: "image", widget: "image", required: false }
  - name: "pages"
    label: "Pages"
    description: "Additional pages (About, Contact, etc). Each page gets its own URL."
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    preview_path: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }
  # Work collection removed for single landing page - not needed for Hearth & Honey café
  # To re-enable, uncomment and use src/content/work for portfolio items
