<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Content Manager — Sveltia CMS</title>
    <style>
      :root { color-scheme: light; }
    </style>
  </head>
  <body>
    <!-- Sveltia CMS — free, open source, Git-based, drop-in Decap replacement -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    
        <script>
      // Keep only Login with GitHub (real OAuth) - hide Access Token fallback as requested
      document.addEventListener('DOMContentLoaded', () => {
        const hideAccessToken = () => {
          for (const b of document.querySelectorAll('button')) {
            if (b.innerText.includes('Access Token')) {
              b.style.display = 'none';
            }
          }
        };
        hideAccessToken();
        new MutationObserver(hideAccessToken).observe(document.body, {childList:true, subtree:true});
      });
    </script>
    <script>
    // ============================================================
    // Sveltia CMS preview templates — EXACT frontend render
    // In Sveltia, entry IS the data object (plain JS).
    // Do NOT use entry.getIn(['data']).toJS() — that is Decap/Immutable.js.
    // ============================================================
    CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap", { raw: false });

    // --- CSS reset for preview pane ---
    CMS.registerPreviewStyle(`*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#FFECCC;color:#000;overflow-x:hidden}
a{color:inherit;text-decoration:none}`, { raw: true });

    // --- Color tokens ---
    const P = '#FFECCC', G = '#005B4A', GR = '#1A472C', M = '#D99E4F', Y = '#FEC135', B = '#916F44', BK = '#0A1C11', C = '#FAF3E3';
    const ff = (f) => "font-family:'" + f + "',serif";
    const FW = "font-family:'DM Sans',system-ui,sans-serif";
    const FH = "font-family:'Fraunces',serif;font-weight:600";
    const FS = "font-family:'Great Vibes',cursive;font-weight:600";
    const FQ = "font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500";

    // --- Helper: safe entry accessor ---
    const D = (entry) => typeof entry?.toJS === 'function' ? entry.toJS() : (entry || {});

    // --- Star SVG ---
    const starSvg = h("svg", {width:18,height:17,viewBox:"0 0 18 17",fill:"none",style:"display:inline-block;flex-shrink:0"},
      h("path", {d:"M9 0l2.47 5.01L17 5.81l-4 3.9.94 5.5L9 12.49l-4.94 2.72.94-5.5-4-3.9 5.53-.8L9 0z", fill:"#FEC135"})
    );

    // ============================================================
    // HOME — full frontend render (not iframe)
    // ============================================================
    CMS.registerPreviewTemplate("home", ({ entry }) => {
      try {
        const d = D(entry);
        const h1 = d.hero_heading || 'Your neighborhood spot for coffee and good company';
        const sub = d.hero_text || 'We serve specialty coffee, fresh pastries, and all-day breakfast in a warm, modern space.';
        const btns = d.hero_buttons || [{label:'Explore Menu',href:'#menu'},{label:'Book a Table',href:'#book'}];
        const aObj = d.about || {};
        const aTag = aObj.tagline || 'About';
        const aH = aObj.heading || 'A good caf\u00e9 is a clean, well-lighted place';
        const aTxt = aObj.text || 'We built Hearth & Honey to be simple and true. Good coffee, honest food, and a room that feels right.';
        const aImg = aObj.image || '/shots/figma-1.png';
        const mObj = d.menu || {};
        const mTag = mObj.tag || 'Menu';
        const mH = mObj.heading || 'What we do well';
        const mTxt = mObj.text || 'A few things we make every day.';
        const tabs = (mObj.tabs && mObj.tabs.length) ? mObj.tabs : [];
        const tObj = d.testimonials || {};
        const tH = tObj.heading || 'Customer testimonials';
        const tTxt = tObj.text || 'Come for the coffee. Stay for the moment.';
        const tItems = (tObj.items && tObj.items.length) ? tObj.items : [];
        const fObj = d.faq || {};
        const fH = fObj.heading || 'FAQs';
        const fTxt = fObj.text || 'Find quick answers about your visit.';
        const fItems = (fObj.items && fObj.items.length) ? fObj.items : [];
        const cObj = d.contact || {};
        const cTag = cObj.tagline || 'Visit Us';
        const cH = cObj.heading || 'Contact us';
        const cTxt = cObj.text || 'Find us on Hearth Lane \u2014 open daily from 7am.';
        const cItems = (cObj.items && cObj.items.length) ? cObj.items : [];
        const cImg = cObj.image || '/shots/figma-3.png';
        const ctObj = d.cta || {};
        const ctH = ctObj.heading || 'See you at the counter';
        const ctTxt = ctObj.text || 'Stop by for a coffee or stay for brunch.';

        // --- Banner ---
        const banner = d.banner || {};
        const bannerEl = banner.enabled !== false ? h("div", {style:`background:${G};color:#fff;border-radius:32px;outline:2px solid #fff;outline-offset:-2px;display:flex;align-items:center;justify-content:space-between;gap:32px;padding:12px 16px;margin:0 0 8px;flex-wrap:wrap;${FW};font-size:14px`},
          h("div", {style:"display:flex;align-items:center;gap:16px;flex:1;min-width:280px"},
            h("h2", {style:"font-size:16px;font-weight:600;line-height:24px;margin:0"}, banner.heading || 'Fresh pastries are half off after 3 pm'),
            h("p", {style:"font-size:14px;line-height:21px;margin:0;opacity:.95"}, banner.text || 'Join the list for the daily special')
          ),
          h("div", {style:"display:flex;align-items:center;gap:16px;flex-shrink:0"},
            h("div", {style:"border-bottom:2px solid #fff;min-width:180px;padding:4px 0;font-size:14px;opacity:.7"}, banner.placeholder || 'Enter your email'),
            h("button", {style:`background:${Y};color:#000;border-radius:6px;padding:4px 10px;font-weight:500;font-size:14px;border:none;cursor:pointer;${FW}`}, banner.button || 'Sign up')
          )
        ) : null;

        // --- Navbar ---
        const navLogo = (d.navbar && d.navbar.logo) || 'Hearth & Honey';
        const navBtnLabel = (d.navbar && d.navbar.cta_label) || 'Book a Table';
        const navLinks = d.navbar_links || [{label:'Our story',href:'#story'},{label:'Menu',href:'#menu'},{label:'Visit',href:'#visit'}];
        const navLinksEls = navLinks.map(l => h("a", {href:l.href||'#', style:`${FW};font-size:14px;color:${G};line-height:20px;white-space:nowrap;padding:4px 0;display:inline-block`}, l.label));
        const navbar = h("div", {style:`${FW};background:${P};padding:10px 32px 12px;display:flex;align-items:center;justify-content:space-between;gap:16px`},
          h("div", {style:`${FH};font-size:22px;color:#000;white-space:nowrap`}, navLogo),
          h("div", {style:"display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:flex-end"},
            h("div", {style:"display:flex;gap:16px;align-items:center;flex-wrap:wrap"}, ...navLinksEls),
            h("button", {style:`background:${M};color:#fff;border-radius:6px;padding:6px 14px;font-weight:500;font-size:14px;border:none;cursor:pointer;${FW}`}, navBtnLabel)
          )
        );

        // --- Hero ---
        const heroImg = 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1920&q=80';
        const heroBtnEls = btns.map(b => h("a", {href:b.href||'#', style:`background:${M};color:#000;border-radius:6px;padding:8px 16px;font-weight:500;font-size:15px;display:inline-block;${FW}`}, b.label));
        const hero = h("div", {style:`position:relative;min-height:500px;background:linear-gradient(0deg,rgba(0,0,0,.40),rgba(0,0,0,.40)),url('${heroImg}') center/cover no-repeat;display:flex;align-items:stretch;padding:0 48px;overflow:hidden`},
          h("div", {style:`display:grid;grid-template-columns:1fr 1fr;gap:60px;width:100%;padding:80px 0;max-width:1280px;margin:0 auto`},
            h("div", {style:`${FH};font-weight:600;font-size:56px;line-height:1.15;color:#fff;text-wrap:balance`}, h1),
            h("div", {style:"display:flex;flex-direction:column;gap:16px;justify-content:flex-end;text-align:left"},
              h("p", {style:"color:#fff;font-size:16px;line-height:24px"}, sub),
              h("div", {style:"display:flex;gap:12px;flex-wrap:wrap"}, ...heroBtnEls)
            )
          )
        );

        // --- About ---
        const aboutBtns = (aObj.buttons || []).map(b => h("a", {href:b.href||'#', style:`padding:8px 16px;border-radius:6px;outline:2px solid #000;font-weight:500;font-size:14px;display:inline-block;${FW}`}, b.label));
        const about = h("div", {style:`${FW};background:${P};padding:64px 48px`},
          h("div", {style:"display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;max-width:1280px;margin:0 auto"},
            h("div", {style:"display:flex;flex-direction:column;gap:16px"},
              h("div", {style:`${FS};font-size:28px;color:${G};letter-spacing:0.03em`}, aTag),
              h("h2", {style:`${FH};font-size:44px;line-height:1.2;color:#000`}, aH),
              h("p", {style:"font-size:16px;line-height:24px;color:#000"}, aTxt),
              h("div", {style:"display:flex;gap:16px;align-items:center;flex-wrap:wrap"}, ...aboutBtns)
            ),
            h("img", {src:aImg, style:"height:500px;border-radius:32px;width:100%;object-fit:cover", loading:"lazy"})
          )
        );

        // --- Menu ---
        const tabBtns = tabs.map((t,i) => h("div", {style:`padding:18px 16px;text-align:center;${FH};font-size:18px;color:${G};cursor:pointer;background:${i===0?'#fff':C};border:1px solid ${BK};margin:-1px 0 0 -1px;${i===tabs.length-1?'border-right:none':''};${i===0?'border-left:2px solid '+BK:''}`}, t.label || t.id));
        const firstTab = tabs[0] || {};
        const tabContent = firstTab ? h("div", {style:`display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;background:${B};padding:36px;color:#fff;min-height:360px;border-radius:0 0 32px 32px`},
          h("div", {style:"display:flex;flex-direction:column;gap:12px"},
            h("div", {style:`font-size:14px;font-weight:600`}, firstTab.tag || ''),
            h("h3", {style:`${FH};font-size:36px;line-height:1.15;margin:0`}, firstTab.heading || ''),
            h("p", {style:"font-size:14px;line-height:20px"}, firstTab.text || '')
          ),
          h("img", {src:firstTab.image||'', style:"height:400px;border-radius:24px;width:100%;object-fit:cover", loading:"lazy"})
        ) : null;
        const menu = h("div", {style:`${FW};background:${P};padding:0 48px 48px`},
          h("div", {style:`background:${G};border-radius:32px;padding:36px 0 0;display:flex;flex-direction:column;align-items:center;gap:32px;overflow:hidden`},
            h("div", {style:"max-width:700px;text-align:center;display:flex;flex-direction:column;gap:16px;padding:0 20px;width:100%"},
              h("div", {style:`${FS};font-size:32px;color:${Y};letter-spacing:0.04em`}, mTag),
              h("h2", {style:`${FH};font-size:44px;line-height:1.15;color:#fff;margin:0`}, mH),
              h("p", {style:"font-size:16px;line-height:24px;color:#fff;margin:0"}, mTxt)
            ),
            h("div", {style:`width:100%;background:${Y};border-radius:0 0 32px 32px;outline:2px solid ${BK};outline-offset:-2px;display:flex;flex-direction:column`},
              h("div", {style:"display:grid;grid-template-columns:repeat(" + Math.min(tabs.length, 6) + ",1fr);border-bottom:2px solid " + BK + ";background:" + Y}, ...tabBtns),
              tabContent
            )
          )
        );

        // --- Testimonials ---
        const starRow = h("div", {style:"display:flex;gap:4px"}, ...Array(5).fill(starSvg));
        const tCardEls = tItems.map(item => h("div", {style:`background:#fff;border-radius:24px;outline:2px solid #000;outline-offset:-2px;padding:24px;display:flex;flex-direction:column;gap:16px;min-height:220px`},
          starRow,
          h("div", {style:`${FQ};font-size:20px;line-height:28px;color:#000`}, item.quote || ''),
          h("div", {style:"display:flex;gap:12px;align-items:center"},
            h("img", {src:item.avatar||'/shots/avatar-0.jpg', style:"width:40px;height:40px;border-radius:50%;object-fit:cover", loading:"lazy"}),
            h("div", {},
              h("b", {style:"font-size:14px;font-weight:600;line-height:20px;display:block"}, item.name || ''),
              h("span", {style:"font-size:14px;line-height:20px;color:#666"}, item.role || '')
            )
          )
        ));
        const testimonials = h("div", {style:`${FW};background:${P};padding:64px 48px`},
          h("div", {style:"max-width:700px;margin:0 auto;text-align:center;display:flex;flex-direction:column;gap:16px"},
            h("h2", {style:`${FH};font-size:44px;line-height:1.15;margin:0`}, tH),
            h("p", {style:`${FQ};font-size:20px;line-height:28px;color:#333;margin:0`}, tTxt)
          ),
          h("div", {style:"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px;max-width:1200px;margin-left:auto;margin-right:auto"}, ...tCardEls)
        );

        // --- FAQ ---
        const faqEls = fItems.map(item => h("div", {style:`background:#fff;border-radius:24px;outline:2px solid ${BK};outline-offset:-2px;overflow:hidden`},
          h("div", {style:"padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px"},
            h("b", {style:"font-size:16px;font-weight:700;line-height:24px"}, item.q || ''),
            h("span", {style:"font-size:20px;color:#666;flex-shrink:0"}, '+')
          ),
          h("div", {style:"padding:0 20px 16px"},
            h("p", {style:"font-size:14px;line-height:20px;color:#444;margin:0"}, item.a || '')
          )
        ));
        const faq = h("div", {style:`${FW};background:${P};padding:64px 48px`},
          h("div", {style:"max-width:700px;margin:0 auto;text-align:center;display:flex;flex-direction:column;gap:16px"},
            h("h2", {style:`${FH};font-size:44px;line-height:1.15;margin:0`}, fH),
            h("p", {style:"font-size:16px;line-height:24px;margin:0"}, fTxt)
          ),
          h("div", {style:"max-width:700px;margin:36px auto 0;display:flex;flex-direction:column;gap:12px"}, ...faqEls)
        );

        // --- Contact ---
        const cSvgMail = h("svg", {width:28,height:28,viewBox:"0 0 32 32",fill:"none",style:"flex-shrink:0"},
          h("path", {d:"M4.74 5.63H27.26c.48 0 .89.17 1.25.53.36.36.53.77.53 1.25v17.19c0 .47-.17.88-.53 1.24-.36.36-.77.53-1.25.53H4.74c-.42 0-.78-.13-1.11-.4l-.14-.13c-.36-.36-.53-.77-.53-1.24V7.41c0-.48.17-.89.53-1.25l.14-.13c.33-.27.69-.4 1.11-.4z", stroke:"#000", strokeWidth:1.5, fill:"none"})
        );
        const cSvgPhone = h("svg", {width:28,height:28,viewBox:"0 0 32 32",fill:"none",style:"flex-shrink:0"},
          h("path", {d:"M5.49 4.29h4.67c.28 0 .5.09.67.25.19.18.34.43.42.77l.89 4.03c.05.33.04.59-.01.81-.05.21-.15.38-.3.53l-.01.01-3.36 3.31-.28.27.2.34c.57.95 1.17 1.84 1.8 2.67.64.83 1.35 1.62 2.13 2.37.81.84 1.66 1.6 2.55 2.29.89.68 1.82 1.29 2.8 1.8l.33.17.26-.27 3.21-3.29.01-.01c.2-.22.42-.36.66-.43.24-.05.49-.04.78.02l3.77.84c.32.09.57.25.75.47.18.22.27.47.27.76v4.55c0 .36-.11.63-.34.85-.23.23-.5.34-.86.34-2.53-.01-5.11-.61-7.76-1.84-2.64-1.23-5.1-2.98-7.37-5.25-2.13-2.13-3.8-4.42-4.91-6.13L5.5 13.25l-.23-.5-.22-.49C4.03 10.27 3.5 7.86 3.5 5.49c0-.31.09-.56.26-.77l.08-.08c.22-.23.49-.34.86-.34z", stroke:"#000", strokeWidth:1.5, fill:"none"})
        );
        const cSvgMap = h("svg", {width:28,height:28,viewBox:"0 0 32 32",fill:"none",style:"flex-shrink:0"},
          h("path", {d:"M16 2.96c2.74 0 5.15.96 7.25 2.89 2.07 1.9 3.12 4.46 3.12 7.72 0 1.34-.3 2.68-.9 4.01-.6 1.36-1.37 2.66-2.29 3.91-.93 1.25-1.93 2.42-3.02 3.51-1.1 1.1-2.12 2.07-3.07 2.92l-.01.01-.01.01c-.14.13-.3.23-.49.29-.21.07-.41.08-.6 0a1.5 1.5 0 01-.49-.29l-.01-.01-.01-.01c-.95-.85-1.97-1.82-3.07-2.92-1.09-1.09-2.09-2.26-3.02-3.51-.92-1.25-1.69-2.55-2.29-3.91-.6-1.33-.9-2.67-.9-4.01 0-3.26 1.05-5.82 3.12-7.72C10.85 3.92 13.26 2.96 16 2.96z", stroke:"#000", strokeWidth:1.5, fill:"none"})
        );
        const cSvgs = [cSvgMail, cSvgPhone, cSvgMap];
        const cItemEls = cItems.map((item, i) => h("div", {style:"display:flex;gap:16px;align-items:flex-start"},
          cSvgs[i] || cSvgMap,
          h("div", {},
            h("h3", {style:"font-size:16px;font-weight:700;line-height:24px;margin:0"}, item.heading || ''),
            h("p", {style:"font-size:14px;line-height:20px;margin:0 0 4px"}, item.text || ''),
            h("a", {href:item.link||'#', style:`font-size:14px;color:${G};font-weight:500;text-decoration:underline`}, item.link_text || '')
          )
        ));
        const contact = h("div", {style:`${FW};background:${P};padding:64px 48px`},
          h("div", {style:"display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;max-width:1200px;margin:0 auto"},
            h("div", {style:"display:flex;flex-direction:column;gap:12px"},
              h("div", {style:`${FS};font-size:20px;color:${G}`}, cTag),
              h("h2", {style:`${FH};font-size:44px;line-height:1.15;margin:0`}, cH),
              h("p", {style:"font-size:16px;line-height:24px;margin:0"}, cTxt),
              h("div", {style:"display:flex;flex-direction:column;gap:20px;margin-top:8px"}, ...cItemEls)
            ),
            h("img", {src:cImg, style:"height:480px;border-radius:32px;width:100%;object-fit:cover", loading:"lazy"})
          )
        );

        // --- CTA ---
        const ctaBtns = (ctObj.buttons || [{label:'Book a Table',href:'#book'},{label:'See the menu',href:'#menu'}]).map(b => h("a", {href:b.href||'#', style:`background:${M};color:#000;border-radius:6px;padding:8px 16px;font-weight:500;font-size:14px;display:inline-block;${FW}`}, b.label));
        const cta = h("div", {style:`${FW};background:${P};padding:0 48px 64px`},
          h("div", {style:`background:${BK};border-radius:32px;padding:48px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center`},
            h("h2", {style:`${FH};font-size:44px;line-height:1.15;color:#fff;margin:0`}, ctH),
            h("p", {style:"font-size:16px;line-height:24px;color:#ccc;margin:0"}, ctTxt),
            h("div", {style:"display:flex;gap:12px;flex-wrap:wrap;justify-content:center"}, ...ctaBtns)
          )
        );

        // --- Footer ---
        const footer = h("div", {style:`${FW};background:${BK};color:#fff;padding:48px 48px 24px`},
          h("div", {style:"display:grid;grid-template-columns:1.5fr 320px;gap:40px;max-width:1200px;margin:0 auto"},
            h("div", {style:"display:grid;grid-template-columns:repeat(4,1fr);gap:32px"},
              h("div", {style:`${FH};font-size:18px;color:#fff`}, navLogo),
              h("div", {style:"display:flex;flex-direction:column;gap:8px"},
                h("h4", {style:"font-size:14px;font-weight:700;margin:0 0 8px"}, 'Join our newsletter'),
                h("a", {href:"#",style:"font-size:13px;color:#aaa"}, 'Our story'),
                h("a", {href:"#",style:"font-size:13px;color:#aaa"}, 'Menu'),
                h("a", {href:"#",style:"font-size:13px;color:#aaa"}, 'Reservations')
              ),
              h("div", {style:"display:flex;flex-direction:column;gap:8px"},
                h("h4", {style:"font-size:14px;font-weight:700;margin:0 0 8px"}, 'Visit us'),
                h("a", {href:"#",style:"font-size:13px;color:#aaa"}, 'Find us'),
                h("a", {href:"#",style:"font-size:13px;color:#aaa"}, 'Careers'),
                h("a", {href:"#",style:"font-size:13px;color:#aaa"}, 'Press')
              ),
              h("div", {style:"display:flex;flex-direction:column;gap:8px"},
                h("h4", {style:"font-size:14px;font-weight:700;margin:0 0 8px"}, 'Our menu'),
                h("a", {href:"#",style:"font-size:13px;color:#aaa"}, 'Coffee'),
                h("a", {href:"#",style:"font-size:13px;color:#aaa"}, 'Pastries'),
                h("a", {href:"#",style:"font-size:13px;color:#aaa"}, 'Breakfast')
              )
            ),
            h("div", {style:"display:flex;flex-direction:column;gap:12px"},
              h("h4", {style:"font-size:16px;font-weight:700;margin:0"}, d.footer?.newsletter_heading || 'Get in touch'),
              h("p", {style:"font-size:14px;color:#aaa;margin:0;line-height:20px"}, d.footer?.newsletter_text || 'Get the word on new roasts and weekend specials.'),
              h("div", {style:"display:flex;gap:8px;align-items:center"},
                h("div", {style:"flex:1;border-bottom:1px solid #555;padding:6px 0;font-size:14px;color:#888"}, d.footer?.placeholder || 'Enter your email'),
                h("button", {style:`background:${M};color:#fff;border-radius:6px;padding:6px 12px;font-weight:500;font-size:13px;border:none;cursor:pointer;${FW}`}, d.footer?.button || 'Subscribe')
              ),
              h("p", {style:"font-size:11px;color:#888;margin:0"}, d.footer?.fineprint || 'By subscribing you agree to our Privacy Policy')
            )
          ),
          h("div", {style:`border-top:1px solid #333;margin-top:24px;padding-top:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:13px;color:#888`},
            h("span", {}, '\u00a9 2024 Hearth & Honey. All rights reserved.'),
            h("div", {style:"display:flex;gap:16px"},
              h("a", {href:"#",style:"color:#aaa"}, 'Privacy'),
              h("a", {href:"#",style:"color:#aaa"}, 'Terms')
            )
          )
        );

        // --- Scroll hint ---
        const hint = h("div", {style:`${FW};text-align:center;padding:8px;font-size:11px;color:#888;background:${P}`}, 'Scroll to see full page \u2193');

        return h("div", {style:`${FW};background:${P};min-width:320px`}, bannerEl, navbar, hero, about, menu, testimonials, faq, contact, cta, footer, hint);
      } catch(e) {
        console.error('[HH Preview] Home error:', e);
        return h("div", {style:"padding:24px;color:red;font-family:monospace"}, "Preview error: " + e.message);
      }
    });

    // --- Pages (additional markdown pages) ---
    CMS.registerPreviewTemplate("pages", ({ entry }) => {
      try {
        const d = D(entry);
        return h("div", {style:`${FW};background:${P};padding:24px`},

            h("h1", {style:`${FH};font-size:28px;margin:0`}, d.title || 'New Page'),
            h("p", {style:"font-size:14px;margin:8px 0 0"}, d.description || '')
          ),
          h("div", {style:"background:#fff;border:2px solid #000;border-radius:16px;padding:20px;margin-top:16px"},
            d.body ? h("div", {dangerouslySetInnerHTML:{__html: d.body}}) : h("p", {style:"color:#666"}, "No body yet \u2014 add markdown. Preview at /{{slug}}")
          ),
          h("div", {style:"font-size:11px;color:#666;text-align:center;margin-top:12px"}, "This page will be at /{{slug}} \u2014 Save \u2192 Workflow \u2192 Publish.")
        );
      } catch(e) {
        console.error('[HH Preview] Pages error:', e);
        return h("div", {style:"padding:24px;color:red;font-family:monospace"}, "Preview error: " + e.message);
      }
    });

    // --- Site Settings (file collection: general.yaml) ---
    CMS.registerPreviewTemplate("general", ({ entry }) => {
      try {
        const d = D(entry);
        return h("div", {style:`${FW};background:${P};padding:24px`},
          h("div", {style:`background:linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,.4)),url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80') center/cover;color:#fff;borderRadius:24;padding:32,minHeight:200,display:flex,flexDirection:column,justifyContent:flex-end`},
            h("h1", {style:`${FH};font-size:28px;margin:0`}, d.site_title || 'Hearth & Honey'),
            h("p", {style:"font-size:14px;margin:8px 0 0"}, d.tagline || 'Warm mornings, soft light')
          ),
          h("div", {style:"background:#fff;border:2px solid #000;border-radius:16px;padding:20px;margin-top:16px"},
            h("h2", {style:`${FH};font-size:22px;margin:0 0 8px`}, "Site Settings"),
            h("p", {}, "Edit site title and tagline here. For the full page, edit Home \u2192 Landing \u2192 Home.")
          )
        );
      } catch(e) {
        console.error('[HH Preview] Site error:', e);
        return h("div", {style:"padding:24px;color:red;font-family:monospace"}, "Preview error: " + e.message);
      }
    });

    // --- Work card preview ---
    CMS.registerPreviewTemplate("work", ({ entry }) => {
      try {
        const d = D(entry);
        return h("div", {style:`${FW};padding:24px`},
          h("div", {style:`border:2px solid #0A0A0A;max-width:600px;border-radius:12px;overflow:hidden`},
            h("div", {style:"border-bottom:2px solid #0A0A0A;padding:8px 12px;font-size:12px;font-weight:700"}, d.title || "Preview"),
            d.image ? h("img", {src:d.image, style:"width:100%;display:block"}) : null,
            h("div", {style:"padding:16px"},
              h("h3", {}, d.title),
              h("p", {style:"color:#555;font-size:14px"}, d.excerpt),
              h("div", {style:"margin-top:12px;font-weight:800"}, "Enquire \u2192")
            )
          )
        );
      } catch(e) {
        console.error('[HH Preview] Work error:', e);
        return h("div", {style:"padding:24px;color:red;font-family:monospace"}, "Preview error: " + e.message);
      }
    });
    </script>
