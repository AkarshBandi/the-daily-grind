<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Content Manager — Sveltia CMS</title>
    <style>
      :root { color-scheme: light; }
    </style>
  </head>
  <body>
    <!-- Sveltia CMS — free, open source, Git-based, drop-in Decap replacement -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    
        <script>
      // Keep only Login with GitHub (real OAuth) - hide Access Token fallback as requested
      document.addEventListener('DOMContentLoaded', () => {
        const hideAccessToken = () => {
          for (const b of document.querySelectorAll('button')) {
            if (b.innerText.includes('Access Token')) {
              b.style.display = 'none';
            }
          }
        };
        hideAccessToken();
        new MutationObserver(hideAccessToken).observe(document.body, {childList:true, subtree:true});
      });
    </script>
    <script>
    // ============================================================
    // Sveltia CMS Preview — LIVE updates via postMessage
    //
    // Architecture:
    //   1. Iframe loads ONCE with static URL (fast, no data in URL)
    //   2. Module-level _hhLatestD is updated on every template render
    //   3. setCheck() polls every 300ms, sends postMessage only when data changed
    //   4. No iframe reload = no loading spinner = instant feedback
    //   5. Editor<->Preview bidirectional scroll via postMessage
    //
    // In Sveltia, entry IS the data object (plain JS, no getIn/toJS).
    // Sveltia renders h() vnodes via React.createElement into blob: iframes.
    // ============================================================
    CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap", { raw: false });

    var D = function(e) { return (e && typeof e.toJS === 'function') ? e.toJS() : (e || {}); };
    var esc = function(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };

    // --- Module-level state for live preview bridge ---
    var _hhBase = 'https://the-daily-grind-7y2.pages.dev';
    var _hhPreviewUrl = _hhBase + '/preview?edit=1';
    var _hhLiveUrl = _hhBase + '/';
    var _hhLatestD = null;           // updated on every template render
    var _hhSentStr = '';              // last JSON.stringify we sent (avoid duplicates)
    var _hhPollTimer = null;          // single interval, created once
    var _hhIframeReady = false;       // true after iframe onload fires

    // Poll: send data to iframe ONLY when it changed (instant, no reload)
    function _hhStartPolling() {
      if (_hhPollTimer) return;
      _hhPollTimer = setInterval(function () {
        var ifr = document.getElementById('hh-live-iframe');
        if (!ifr || !ifr.contentWindow) return;
        if (!_hhLatestD) return;
        var str = JSON.stringify(_hhLatestD);
        if (str === _hhSentStr) return;          // nothing changed
        _hhSentStr = str;
        try {
          ifr.contentWindow.postMessage({ type: 'hh-cms-data', data: _hhLatestD }, '*');
        } catch (e) {}
      }, 200);
    }

    // --- HOME template ---
    CMS.registerPreviewTemplate("home", function (ctx) {
      try {
        var d = D(ctx.entry);
        _hhLatestD = d;   // update module-level reference (no reload needed)

        // Start polling once iframe exists
        if (!_hhPollTimer) {
          // Try to find iframe and attach onload
          setTimeout(function () {
            var ifr = document.getElementById('hh-live-iframe');
            if (ifr) {
              ifr.addEventListener('load', function () {
                _hhIframeReady = true;
                _hhStartPolling();
                // Send initial data immediately after load
                if (_hhLatestD) {
                  _hhSentStr = JSON.stringify(_hhLatestD);
                  try {
                    ifr.contentWindow.postMessage({ type: 'hh-cms-data', data: _hhLatestD }, '*');
                  } catch (e) {}
                }
              }, { once: true });
            }
            _hhStartPolling();
          }, 50);
        }

        // Return vnodes — iframe loads ONCE, src never changes
        return h('div', { style: { maxWidth: '100%', padding: 0, fontFamily: 'sans-serif', display: 'flex', flexDirection: 'column', height: 'calc(100vh - 16px)', background: '#FFECCC' } },
          h('div', { style: { display: 'flex', gap: '8px', alignItems: 'center', justifyContent: 'space-between', background: '#FFECCC', border: '2px solid #1A472C', borderRadius: '12px', padding: '8px 12px', marginBottom: '8px', flexShrink: '0' } },
            h('span', { style: { fontSize: '13px', fontWeight: '600', color: '#1A472C' } }, 'Live preview — click any text to jump to its field'),
            h('a', { href: _hhLiveUrl, target: '_blank', style: { fontSize: '12px', color: '#1A472C', textDecoration: 'underline' } }, 'Open live site')),
          h('iframe', { id: 'hh-live-iframe', src: _hhPreviewUrl, title: 'Hearth & Honey live preview', style: { width: '100%', flex: '1', minHeight: '60vh', border: '2px solid #1A472C', borderRadius: '12px', background: '#fff', display: 'block' } }));
      } catch(e) {
        return h("div", { style: { padding: "24px", color: "red", fontFamily: "monospace" } }, "Preview error: " + e.message);
      }
    });

    // --- Pages (additional markdown pages) ---
    CMS.registerPreviewTemplate("pages", function (ctx) {
      try {
        var d = D(ctx.entry);
        var html = '<div style="font-family:\'DM Sans\',system-ui,sans-serif;background:#FFECCC;padding:24px"><div style="background:linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,.4)),url(\'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80\') center/cover;color:#fff;border-radius:24px;padding:32px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end"><h1 style="font-family:\'Fraunces\',serif;font-size:28px;margin:0">' + esc(d.title || 'New Page') + '</h1><p style="font-size:14px;margin:8px 0 0">' + esc(d.description || '') + '</p></div><div style="background:#fff;border:2px solid #000;border-radius:16px;padding:20px;margin-top:16px"><p style="color:#666">' + esc(d.body || 'No body yet — add markdown.') + '</p></div></div>';
        return h("div", { dangerouslySetInnerHTML: { __html: html } });
      } catch(e) {
        return h("div", { style: { padding: "24px", color: "red", fontFamily: "monospace" } }, "Preview error: " + e.message);
      }
    });

    // --- Site Settings ---
    CMS.registerPreviewTemplate("general", function (ctx) {
      try {
        var d = D(ctx.entry);
        var html = '<div style="font-family:\'DM Sans\',system-ui,sans-serif;background:#FFECCC;padding:24px"><div style="background:linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,.4)),url(\'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80\') center/cover;color:#fff;border-radius:24px;padding:32px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end"><h1 style="font-family:\'Fraunces\',serif;font-size:28px;margin:0">' + esc(d.site_title || 'Hearth & Honey') + '</h1><p style="font-size:14px;margin:8px 0 0">' + esc(d.tagline || 'Warm mornings, soft light') + '</p></div><div style="background:#fff;border:2px solid #000;border-radius:16px;padding:20px;margin-top:16px"><h2 style="font-family:\'Fraunces\',serif;font-size:22px;margin:0 0 8px">Site Settings</h2><p>Edit site title and tagline here.</p></div></div>';
        return h("div", { dangerouslySetInnerHTML: { __html: html } });
      } catch(e) {
        return h("div", { style: { padding: "24px", color: "red", fontFamily: "monospace" } }, "Preview error: " + e.message);
      }
    });

    // --- Work card preview ---
    CMS.registerPreviewTemplate("work", function (ctx) {
      try {
        var d = D(ctx.entry);
        var img = d.image ? '<img src="' + esc(d.image) + '" style="width:100%;display:block">' : '';
        var html = '<div style="font-family:\'DM Sans\',system-ui,sans-serif;padding:24px"><div style="border:2px solid #0A0A0A;max-width:600px;border-radius:12px;overflow:hidden"><div style="border-bottom:2px solid #0A0A0A;padding:8px 12px;font-size:12px;font-weight:700">' + esc(d.title || 'Preview') + '</div>' + img + '<div style="padding:16px"><h3>' + esc(d.title || '') + '</h3><p style="color:#555;font-size:14px">' + esc(d.excerpt || '') + '</p><div style="margin-top:12px;font-weight:800">Enquire →</div></div></div></div>';
        return h("div", { dangerouslySetInnerHTML: { __html: html } });
      } catch(e) {
        return h("div", { style: { padding: "24px", color: "red", fontFamily: "monospace" } }, "Preview error: " + e.message);
      }
    });

    // ============================================================
    // PREVIEW → EDITOR: click text in preview → focus left field
    //
    // Sveltia renders preview inside a blob: iframe.
    // The blob iframe is created by Sveltia's JS which runs on the
    // SAME origin as the admin page (both are same-origin).
    // So window.top from /preview = the admin page window.
    // Message flow: /preview → window.top (admin page) → listener below
    // ============================================================
    window.addEventListener('message', function (ev) {
      var msg = ev.data;
      if (!msg) return;

      // --- Preview → Editor: focus matching left-panel field ---
      if (msg.type === 'hh-cms-focus' && msg.field) {
        var field = String(msg.field);
        var leaf = field.split('.').pop().toLowerCase().replace(/[_-]+/g, ' ').trim();
        if (!leaf) return;
        var norm = function (s) { return ' ' + String(s || '').toLowerCase().replace(/[_-]+/g, ' ') + ' '; };
        var fields = Array.prototype.slice.call(document.querySelectorAll('input, textarea, select'));
        var best = null, i, f, hay;

        // 1) exact name match (Sveltia sets name="menu.tag" etc.)
        for (i = 0; i < fields.length; i++) {
          f = fields[i];
          if (f.getAttribute('name') === field) { best = f; break; }
        }
        // 2) leaf name in aria-label/name/placeholder/id
        if (!best) for (i = 0; i < fields.length; i++) {
          f = fields[i];
          hay = norm(f.getAttribute('aria-label')) + norm(f.getAttribute('name')) + norm(f.getAttribute('placeholder')) + norm(f.id);
          if (hay.indexOf(' ' + leaf + ' ') !== -1) { best = f; break; }
        }
        // 3) label text match
        if (!best) {
          var labels = Array.prototype.slice.call(document.querySelectorAll('label'));
          for (i = 0; i < labels.length; i++) {
            if (norm(labels[i].textContent).indexOf(' ' + leaf + ' ') !== -1) {
              best = labels[i].querySelector('input, textarea, select');
              if (best) break;
            }
          }
        }
        if (!best) return;
        try { best.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
        try { best.focus({ preventScroll: true }); } catch (e0) { try { best.focus(); } catch (e1) {} }
        var prev = best.style.outline;
        best.style.outline = '3px solid #D99E4F';
        best.style.outlineOffset = '2px';
        setTimeout(function () { best.style.outline = prev; best.style.outlineOffset = ''; }, 1600);
        return;
      }
    });

    // ============================================================
    // EDITOR → PREVIEW: focus left field → scroll preview section
    //
    // When user focuses an input in the left panel, send its
    // field name to the preview iframe so it scrolls to that section.
    // ============================================================
    (function () {
      function fieldFromInput(el) {
        if (!el) return null;
        // Sveltia inputs often have name="menu.tag", "banner.heading", etc.
        var n = el.getAttribute('name');
        if (n && n.indexOf('.') !== -1) return n;
        return null;
      }
      function scrollPreviewTo(field) {
        if (!field) return;
        var ifr = document.getElementById('hh-live-iframe');
        if (!ifr || !ifr.contentWindow) return;
        try { ifr.contentWindow.postMessage({ type: 'hh-scroll-to', field: field }, '*'); } catch (e) {}
      }
      // Focus on input → send field path to preview
      document.addEventListener('focusin', function (ev) {
        var t = ev.target;
        if (!t || !t.matches || !t.matches('input, textarea, select')) return;
        var f = fieldFromInput(t);
        if (f) scrollPreviewTo(f);
      });
      // Click on label → find input → send field path
      document.addEventListener('click', function (ev) {
        var t = ev.target && ev.target.closest ? ev.target.closest('label') : null;
        if (!t) return;
        var inp = t.querySelector('input, textarea, select') || t.nextElementSibling;
        if (inp && inp.matches && inp.matches('input, textarea, select')) {
          var f2 = fieldFromInput(inp);
          if (f2) scrollPreviewTo(f2);
        }
      }, true);
    })();
    </script>
  </body>
</html>
