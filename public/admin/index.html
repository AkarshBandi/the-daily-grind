<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Content Manager — Sveltia CMS</title>
    <style>
      :root { color-scheme: light; }
    </style>
  </head>
  <body>
    <!-- Sveltia CMS — free, open source, Git-based, drop-in Decap replacement -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    
        <script>
      // Keep only Login with GitHub (real OAuth) - hide Access Token fallback as requested
      document.addEventListener('DOMContentLoaded', () => {
        const hideAccessToken = () => {
          for (const b of document.querySelectorAll('button')) {
            if (b.innerText.includes('Access Token')) {
              b.style.display = 'none';
            }
          }
        };
        hideAccessToken();
        new MutationObserver(hideAccessToken).observe(document.body, {childList:true, subtree:true});
      });
    </script>
    <script>
      // Live preview: use the same preview for both site and figma so editor sees full landing page, like Elementor
      CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap");
      CMS.registerPreviewStyle("/src/styles/global.css");
      // Minimal landing preview CSS (mirrors Hearth & Honey landing)
      const landingPreviewCSS = `
        .preview-wrap{max-width:800px;margin:0 auto;font-family:'DM Sans',system-ui,sans-serif;color:#000;background:#FFECCC;padding:24px}
        .preview-hero{background:linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,.4)),url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80') center/cover; color:#fff; border-radius:24px; padding:32px; min-height:320px; display:flex; flex-direction:column; justify-content:flex-end}
        .preview-hero h1{font-family:'Fraunces',serif;font-size:32px;line-height:1.1;margin:0}
        .preview-hero p{font-size:14px;line-height:20px;margin:8px 0 0}
        .preview-section{background:#fff;border:2px solid #000;border-radius:16px;padding:20px;margin-top:16px}
        .preview-section h2{font-family:'Fraunces',serif;font-size:22px;margin:0 0 8px}
        .preview-tag{font-family:'Great Vibes',cursive;font-size:20px;color:#005B4A}
        .preview-quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;line-height:24px}
        .preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
        .preview-card{border:2px solid #000;border-radius:12px;padding:12px;background:#fff}
        .preview-hint{font-size:11px;color:#666;text-align:center;margin-top:12px}
      `;
      const styleEl = document.createElement('style');
      styleEl.textContent = landingPreviewCSS;
      document.head.appendChild(styleEl);
      CMS.registerPreviewStyle(landingPreviewCSS, { raw: true });

      // Helper to get field
      const get = (entry, key, fallback='') => entry.getIn(['data', key]) || fallback;

      // Home landing preview — EXACT frontend live (iframe to /?cms_preview_data=...), not plain text
      const HomeLivePreview = ({ entry }) => {
        const data = entry.getIn(['data']).toJS();
        const previewSrc = "https://the-daily-grind-7y2.pages.dev/?cms_preview_data=" + encodeURIComponent(JSON.stringify(data));
        const liveSrc = "https://the-daily-grind-7y2.pages.dev/";
        const onModeChange = (e) => {
          const ifr = document.getElementById('hh-live-iframe');
          if(ifr) ifr.src = e.target.value === 'live' ? liveSrc : previewSrc;
        };
        return h("div", {style:"max-width:100%;font-family:'DM Sans',system-ui,sans-serif"},
          h("div", {style:"display:flex;gap:8px;align-items:center;justify-content:space-between;background:#FFECCC;border:2px solid #000;border-radius:12px;padding:8px 12px;margin-bottom:8px"},
            h("label", {style:"font-size:12px;font-weight:600"}, "View: ",
              h("select", {id:"hh-preview-mode", onChange:onModeChange, style:"margin-left:6px;padding:4px 8px;border-radius:6px;border:1px solid #000"},
                h("option", {value:"preview"}, "Preview (live edit)"),
                h("option", {value:"live"}, "View Live Site")
              )
            ),
            h("a", {href:liveSrc, target:"_blank", style:"font-size:12px;color:#005B4A;text-decoration:underline"}, "Open live ↗")
          ),
          h("iframe", {id:"hh-live-iframe", src:previewSrc, title:"Hearth & Honey live preview", style:"width:100%;height:78vh;border:2px solid #000;border-radius:12px;background:#fff;display:block"})
        );
      };
      CMS.registerPreviewTemplate("home", HomeLivePreview);

      // Pages (additional pages) preview
      CMS.registerPreviewTemplate("pages", ({ entry }) => {
        const title = get(entry, 'title', 'New Page');
        const desc = get(entry, 'description', '');
        const body = entry.getIn(['data','body']) || '';
        return h("div", {className:"preview-wrap"},
          h("div", {className:"preview-hero", style:"min-height:200px"},
            h("h1", {style:"font-size:28px"}, title),
            h("p", {}, desc)
          ),
          h("div", {className:"preview-section"},
            h("div", {}, body ? h("div", {dangerouslySetInnerHTML:{__html: body}}) : h("p", {style:"color:#666"}, "No body yet — add markdown. Preview at /{{slug}}"))
          ),
          h("div", {className:"preview-hint"}, "This page will be at /{{slug}} — Save → Workflow → Publish, then View on Live Site.")
        );
      });

      // Site Settings preview — also shows landing hero so not just text
      CMS.registerPreviewTemplate("site", "general", ({ entry }) => {
        const title = get(entry, 'site_title', 'Hearth & Honey');
        const tagline = get(entry, 'tagline', 'Warm mornings, soft light');
        return h("div", {className:"preview-wrap"},
          h("div", {className:"preview-hero", style:"min-height:200px"},
            h("h1", {style:"font-size:28px"}, title),
            h("p", {}, tagline)
          ),
          h("div", {className:"preview-section"},
            h("h2", {}, "Site Settings live preview"),
            h("p", {}, "This is just the site title/tagline. For full page, edit Home — Landing → Home.")
          )
        );
      });

      // Work card preview (existing, keep)
      CMS.registerPreviewTemplate("work", ({ entry }) => {
        const title = entry.getIn(["data", "title"]);
        const excerpt = entry.getIn(["data", "excerpt"]);
        const image = entry.getIn(["data", "image"]);
        return h("div", { className: "wrap", style: "padding:24px; font-family: -apple-system, Helvetica, Arial, sans-serif;" },
          h("div", { className: "browser", style: "border:2px solid #0A0A0A; max-width:600px" },
            h("div", { style: "border-bottom:2px solid #0A0A0A; padding:8px 12px; font-size:12px; font-weight:700" }, title || "Preview"),
            image ? h("img", { src: image, style: "width:100%; display:block;" }) : null,
            h("div", { style: "padding:16px" },
              h("h3", {}, title),
              h("p", { style: "color:#555; font-size:14px" }, excerpt),
              h("div", { style: "margin-top:12px; font-weight:800" }, "Enquire →")
            )
          )
        );
      });
    </script>
  </body>
</html>
