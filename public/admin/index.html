<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Content Manager — Sveltia CMS</title>
    <style>
      :root { color-scheme: light; }
    </style>
  </head>
  <body>
    <!-- Sveltia CMS — free, open source, Git-based, drop-in Decap replacement -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    
        <script>
      // Keep only Login with GitHub (real OAuth) - hide Access Token fallback as requested
      document.addEventListener('DOMContentLoaded', () => {
        const hideAccessToken = () => {
          for (const b of document.querySelectorAll('button')) {
            if (b.innerText.includes('Access Token')) {
              b.style.display = 'none';
            }
          }
        };
        hideAccessToken();
        new MutationObserver(hideAccessToken).observe(document.body, {childList:true, subtree:true});
      });
    </script>
    <script>
      // ============================================================
      // Sveltia CMS preview templates
      // IMPORTANT: In Sveltia, `entry` IS the data object directly.
      // Do NOT use entry.getIn(['data']) — that's Decap/Immutable.js.
      // ============================================================
      CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap", { raw: false });

      // --- Home: iframe to the live site with cms_preview_data patch ---
      CMS.registerPreviewTemplate("home", ({ entry }) => {
        try {
          // In Sveltia, entry IS the data (plain object). Serialize directly.
          const data = typeof entry?.toJS === 'function' ? entry.toJS() : (entry || {});
          const json = JSON.stringify(data);
          const previewSrc = "https://the-daily-grind-7y2.pages.dev/?cms_preview_data=" + encodeURIComponent(json);
          const liveSrc = "https://the-daily-grind-7y2.pages.dev/";
          const toolbar = h("div", {style:"display:flex;gap:8px;align-items:center;justify-content:space-between;background:#FFECCC;border:2px solid #1A472C;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-family:'DM Sans',system-ui,sans-serif"},
            h("span", {style:"font-size:13px;font-weight:600;color:#1A472C"}, "\u2705 Live preview — edits apply as you type"),
            h("div", {style:"display:flex;gap:12px;align-items:center"},
              h("select", {id:"hh-preview-mode", onChange:(e)=>{ const ifr=document.getElementById('hh-live-iframe'); if(ifr) ifr.src=e.target.value==='live'?liveSrc:previewSrc; }, style:"padding:4px 8px;border-radius:6px;border:1px solid #1A472C;font-size:12px"},
                h("option", {value:"preview"}, "Preview (live edit)"),
                h("option", {value:"live"}, "View Live Site")
              ),
              h("a", {href:liveSrc, target:"_blank", style:"font-size:12px;color:#1A472C;text-decoration:underline"}, "Open live \u2197")
            )
          );
          const iframe = h("iframe", {id:"hh-live-iframe", src:previewSrc, title:"Hearth & Honey live preview", style:"width:100%;height:78vh;border:2px solid #1A472C;border-radius:12px;background:#fff;display:block"});
          return h("div", {style:"max-width:100%;font-family:'DM Sans',system-ui,sans-serif;padding:0"}, toolbar, iframe);
        } catch(e) {
          console.error('[HH Preview] Home template error:', e);
          return h("div", {style:"padding:24px;color:red;font-family:monospace"}, "Preview error: " + e.message);
        }
      });

      // --- Pages (additional markdown pages) ---
      CMS.registerPreviewTemplate("pages", ({ entry }) => {
        try {
          const d = typeof entry?.toJS === 'function' ? entry.toJS() : (entry || {});
          const title = d.title || 'New Page';
          const desc = d.description || '';
          const body = d.body || '';
          const wrap = {maxWidth:800,margin:'0 auto',fontFamily:"'DM Sans',system-ui,sans-serif",color:'#000',background:'#FFECCC',padding:24};
          const hero = {background:"linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,.4)),url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80') center/cover",color:'#fff',borderRadius:24,padding:32,minHeight:200,display:'flex',flexDirection:'column',justifyContent:'flex-end'};
          return h("div", {style: Object.entries(wrap).map(([k,v])=>k+':'+v).join(';')},
            h("div", {style: Object.entries(hero).map(([k,v])=>k+':'+v).join(';')},
              h("h1", {style:"font-family:'Fraunces',serif;font-size:28px;margin:0"}, title),
              h("p", {style:"font-size:14px;margin:8px 0 0"}, desc)
            ),
            h("div", {style:"background:#fff;border:2px solid #000;border-radius:16px;padding:20px;margin-top:16px"},
              body ? h("div", {dangerouslySetInnerHTML:{__html: body}}) : h("p", {style:"color:#666"}, "No body yet \u2014 add markdown. Preview at /{{slug}}")
            ),
            h("div", {style:"font-size:11px;color:#666;text-align:center;margin-top:12px"}, "This page will be at /{{slug}} \u2014 Save \u2192 Workflow \u2192 Publish, then View on Live Site.")
          );
        } catch(e) {
          console.error('[HH Preview] Pages template error:', e);
          return h("div", {style:"padding:24px;color:red;font-family:monospace"}, "Preview error: " + e.message);
        }
      });

      // --- Site Settings (file collection: general.yaml) ---
      // Register as "general" (file name) — Sveltia looks up by fileName first, then collectionName
      CMS.registerPreviewTemplate("general", ({ entry }) => {
        try {
          const d = typeof entry?.toJS === 'function' ? entry.toJS() : (entry || {});
          const title = d.site_title || 'Hearth & Honey';
          const tagline = d.tagline || 'Warm mornings, soft light';
          return h("div", {style:"max-width:800px;margin:0 auto;font-family:'DM Sans',system-ui,sans-serif;color:#000;background:#FFECCC;padding:24px"},
            h("div", {style:"background:linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,.4)),url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80') center/cover;color:#fff;borderRadius:24,padding:32,minHeight:200,display:'flex',flexDirection:'column',justifyContent:'flex-end'},
              h("h1", {style:"font-family:'Fraunces',serif;font-size:28px;margin:0"}, title),
              h("p", {style:"font-size:14px;margin:8px 0 0"}, tagline)
            ),
            h("div", {style:"background:#fff;border:2px solid #000;border-radius:16px;padding:20px;margin-top:16px"},
              h("h2", {style:"font-family:'Fraunces',serif;font-size:22px;margin:0 0 8px"}, "Site Settings"),
              h("p", {}, "Edit site title and tagline here. For the full page, edit Home \u2192 Landing \u2192 Home.")
            )
          );
        } catch(e) {
          console.error('[HH Preview] Site template error:', e);
          return h("div", {style:"padding:24px;color:red;font-family:monospace"}, "Preview error: " + e.message);
        }
      });

      // --- Work card preview ---
      CMS.registerPreviewTemplate("work", ({ entry }) => {
        try {
          const d = typeof entry?.toJS === 'function' ? entry.toJS() : (entry || {});
          const title = d.title || "Preview";
          const excerpt = d.excerpt || '';
          const image = d.image || null;
          return h("div", {style:"padding:24px;font-family:-apple-system,Helvetica,Arial,sans-serif"},
            h("div", {style:"border:2px solid #0A0A0A;max-width:600px"},
              h("div", {style:"border-bottom:2px solid #0A0A0A;padding:8px 12px;font-size:12px;font-weight:700"}, title),
              image ? h("img", {src:image, style:"width:100%;display:block"}) : null,
              h("div", {style:"padding:16px"},
                h("h3", {}, title),
                h("p", {style:"color:#555;font-size:14px"}, excerpt),
                h("div", {style:"margin-top:12px;font-weight:800"}, "Enquire \u2192")
              )
            )
          );
        } catch(e) {
          console.error('[HH Preview] Work template error:', e);
          return h("div", {style:"padding:24px;color:red;font-family:monospace"}, "Preview error: " + e.message);
        }
      });
    </script>
  </body>
</html>
