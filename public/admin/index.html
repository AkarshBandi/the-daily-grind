<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Content Manager — Sveltia CMS</title>
    <style>
      :root { color-scheme: light; }
    </style>
  </head>
  <body>
    <!-- Sveltia CMS — free, open source, Git-based, drop-in Decap replacement -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    
        <script>
      // Keep only Login with GitHub (real OAuth) - hide Access Token fallback as requested
      document.addEventListener('DOMContentLoaded', () => {
        const hideAccessToken = () => {
          for (const b of document.querySelectorAll('button')) {
            if (b.innerText.includes('Access Token')) {
              b.style.display = 'none';
            }
          }
        };
        hideAccessToken();
        new MutationObserver(hideAccessToken).observe(document.body, {childList:true, subtree:true});
      });
    </script>
    <script>
    // ============================================================
    // Sveltia CMS preview — HTML string injected via
    // dangerouslySetInnerHTML. Sveltia serializes the rendered DOM
    // into a blob iframe; nested h() vnodes stay lazy and only the
    // outer div gets captured (peach background only). A single
    // innerHTML injection bypasses SolidJS rendering entirely.
    // In Sveltia, entry IS the data object (plain JS, no getIn).
    // ============================================================
    CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap", { raw: false });

    const D = (e) => (e && typeof e.toJS === 'function') ? e.toJS() : (e || {});
    const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    // ============================================================
    // HOME — full frontend as one HTML string
    // ============================================================
    CMS.registerPreviewTemplate("home", ({ entry }) => {
      try {
        const d = D(entry);
        const h1 = esc(d.hero_heading || 'Your neighborhood spot for coffee and good company');
        const sub = esc(d.hero_text || 'We serve specialty coffee, fresh pastries, and all-day breakfast in a warm, modern space.');
        const btns = d.hero_buttons || [{label:'Explore Menu',href:'#menu'},{label:'Book a Table',href:'#book'}];
        const a = d.about || {};
        const m = d.menu || {};
        const tabs = m.tabs || [];
        const ti = d.testimonials || {};
        const tiItems = ti.items || [];
        const fa = d.faq || {};
        const faItems = fa.items || [];
        const co = d.contact || {};
        const coItems = co.items || [];
        const ct = d.cta || {};
        const ft = d.footer || {};
        const nb = d.navbar || {};
        const nbLinks = d.navbar_links || [];
        const banner = d.banner || {};
        const navLogo = esc(nb.logo || 'Hearth & Honey');
        const navBtn = esc(nb.cta_label || 'Book a Table');

        let html = `<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',system-ui,sans-serif;background:#FFECCC;color:#000;overflow-x:hidden}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}</style>`;

        if (banner.enabled !== false) {
          html += `<div style="background:#005B4A;color:#fff;border-radius:32px;outline:2px solid #fff;outline-offset:-2px;display:flex;align-items:center;justify-content:space-between;gap:32px;padding:12px 16px;margin:0 0 8px;flex-wrap:wrap;font-family:'DM Sans',system-ui,sans-serif;font-size:14px"><div style="display:flex;align-items:center;gap:16px;flex:1;min-width:280px"><h2 style="font-size:16px;font-weight:600;line-height:24px;margin:0">${esc(banner.heading || 'Fresh pastries are half off after 3 pm')}</h2><p style="font-size:14px;line-height:21px;margin:0;opacity:.95">${esc(banner.text || 'Join the list for the daily special')}</p></div><div style="display:flex;align-items:center;gap:16px;flex-shrink:0"><div style="border-bottom:2px solid #fff;min-width:180px;padding:4px 0;font-size:14px;opacity:.7">${esc(banner.placeholder || 'Enter your email')}</div><button style="background:#FEC135;color:#000;border-radius:6px;padding:4px 10px;font-weight:500;font-size:14px;border:none">${esc(banner.button || 'Sign up')}</button></div></div>`;
        }

        const navLinksHtml = nbLinks.map((l) => `<a href="${esc(l.href || '#')}" style="font-family:'DM Sans',system-ui,sans-serif;font-size:14px;color:#005B4A;line-height:20px;white-space:nowrap;padding:4px 0;display:inline-block">${esc(l.label)}</a>`).join('');
        html += `<div style="font-family:'DM Sans',system-ui,sans-serif;background:#FFECCC;padding:10px 32px 12px;display:flex;align-items:center;justify-content:space-between;gap:16px"><div style="font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:#000;white-space:nowrap">${navLogo}</div><div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:flex-end"><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${navLinksHtml}</div><button style="background:#D99E4F;color:#fff;border-radius:6px;padding:6px 14px;font-weight:500;font-size:14px;border:none">${navBtn}</button></div></div>`;

        const heroBtnsHtml = btns.map((b) => `<a href="${esc(b.href || '#')}" style="background:#D99E4F;color:#000;border-radius:6px;padding:8px 16px;font-weight:500;font-size:15px;display:inline-block">${esc(b.label)}</a>`).join('');
        html += `<div style="position:relative;min-height:500px;background:linear-gradient(0deg,rgba(0,0,0,.40),rgba(0,0,0,.40)),url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;display:flex;align-items:stretch;padding:0 48px;overflow:hidden"><div style="display:grid;grid-template-columns:1fr 1fr;gap:60px;width:100%;padding:80px 0;max-width:1280px;margin:0 auto"><div style="font-family:'Fraunces',serif;font-weight:600;font-size:56px;line-height:1.15;color:#fff">${h1}</div><div style="display:flex;flex-direction:column;gap:16px;justify-content:flex-end;text-align:left"><p style="color:#fff;font-size:16px;line-height:24px">${sub}</p><div style="display:flex;gap:12px;flex-wrap:wrap">${heroBtnsHtml}</div></div></div></div>`;

        const aboutBtns = (a.buttons || []).map((b) => `<a href="${esc(b.href || '#')}" style="padding:8px 16px;border-radius:6px;outline:2px solid #000;font-weight:500;font-size:14px;display:inline-block">${esc(b.label)}</a>`).join('');
        html += `<div style="font-family:'DM Sans',system-ui,sans-serif;background:#FFECCC;padding:64px 48px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;max-width:1280px;margin:0 auto"><div style="display:flex;flex-direction:column;gap:16px"><div style="font-family:'Great Vibes',cursive;font-weight:600;font-size:28px;color:#005B4A;letter-spacing:0.03em">${esc(a.tagline || 'About')}</div><h2 style="font-family:'Fraunces',serif;font-weight:600;font-size:44px;line-height:1.2;color:#000">${esc(a.heading || 'A good café is a clean, well-lighted place')}</h2><p style="font-size:16px;line-height:24px;color:#000">${esc(a.text || 'We built Hearth & Honey to be simple and true.')}</p><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${aboutBtns}</div></div><img src="${esc(a.image || '/shots/figma-1.png')}" style="height:500px;border-radius:32px;width:100%;object-fit:cover" loading="lazy"></div></div>`;

        const tabBtnsHtml = tabs.map((t, i) => `<div style="padding:18px 16px;text-align:center;font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:#005B4A;cursor:pointer;background:${i === 0 ? '#fff' : '#FAF3E3'};border:1px solid #0A1C11;margin:-1px 0 0 -1px">${esc(t.label || t.id)}</div>`).join('');
        const f0 = tabs[0] || {};
        const tabContentHtml = f0.heading ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;background:#916F44;padding:36px;color:#fff;min-height:360px;border-radius:0 0 32px 32px"><div style="display:flex;flex-direction:column;gap:12px"><div style="font-size:14px;font-weight:600">${esc(f0.tag || '')}</div><h3 style="font-family:'Fraunces',serif;font-weight:600;font-size:36px;line-height:1.15;margin:0">${esc(f0.heading)}</h3><p style="font-size:14px;line-height:20px">${esc(f0.text || '')}</p></div><img src="${esc(f0.image || '')}" style="height:400px;border-radius:24px;width:100%;object-fit:cover" loading="lazy"></div>` : '';
        html += `<div style="font-family:'DM Sans',system-ui,sans-serif;background:#FFECCC;padding:0 48px 48px"><div style="background:#005B4A;border-radius:32px;padding:36px 0 0;display:flex;flex-direction:column;align-items:center;gap:32px;overflow:hidden"><div style="max-width:700px;text-align:center;display:flex;flex-direction:column;gap:16px;padding:0 20px;width:100%"><div style="font-family:'Great Vibes',cursive;font-weight:600;font-size:32px;color:#FEC135;letter-spacing:0.04em">${esc(m.tag || 'Menu')}</div><h2 style="font-family:'Fraunces',serif;font-weight:600;font-size:44px;line-height:1.15;color:#fff;margin:0">${esc(m.heading || 'What we do well')}</h2><p style="font-size:16px;line-height:24px;color:#fff;margin:0">${esc(m.text || '')}</p></div><div style="width:100%;background:#FEC135;border-radius:0 0 32px 32px;outline:2px solid #0A1C11;outline-offset:-2px;display:flex;flex-direction:column"><div style="display:grid;grid-template-columns:repeat(${Math.min(tabs.length, 6) || 1},1fr);border-bottom:2px solid #0A1C11;background:#FEC135">${tabBtnsHtml}</div>${tabContentHtml}</div></div></div>`;

        const starSvg = '<svg width="18" height="17" viewBox="0 0 18 17" fill="none" style="display:inline-block;flex-shrink:0"><path d="M9 0l2.47 5.01L17 5.81l-4 3.9.94 5.5L9 12.49l-4.94 2.72.94-5.5-4-3.9 5.53-.8L9 0z" fill="#FEC135"/></svg>';
        const starRow = '<div style="display:flex;gap:4px">' + starSvg + starSvg + starSvg + starSvg + starSvg + '</div>';
        const tiCards = tiItems.map((it) => `<div style="background:#fff;border-radius:24px;outline:2px solid #000;outline-offset:-2px;padding:24px;display:flex;flex-direction:column;gap:16px;min-height:220px">${starRow}<div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:20px;line-height:28px;color:#000">${esc(it.quote || '')}</div><div style="display:flex;gap:12px;align-items:center"><img src="${esc(it.avatar || '/shots/avatar-0.jpg')}" style="width:40px;height:40px;border-radius:50%;object-fit:cover" loading="lazy"><div><b style="font-size:14px;font-weight:600;line-height:20px;display:block">${esc(it.name || '')}</b><span style="font-size:14px;line-height:20px;color:#666">${esc(it.role || '')}</span></div></div></div>`).join('');
        html += `<div style="font-family:'DM Sans',system-ui,sans-serif;background:#FFECCC;padding:64px 48px"><div style="max-width:700px;margin:0 auto;text-align:center;display:flex;flex-direction:column;gap:16px"><h2 style="font-family:'Fraunces',serif;font-weight:600;font-size:44px;line-height:1.15;margin:0">${esc(ti.heading || 'Customer testimonials')}</h2><p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:20px;line-height:28px;color:#333;margin:0">${esc(ti.text || '')}</p></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px;max-width:1200px;margin-left:auto;margin-right:auto">${tiCards}</div></div>`;

        const faqItems = faItems.map((it) => `<div style="background:#fff;border-radius:24px;outline:2px solid #0A1C11;outline-offset:-2px;overflow:hidden"><div style="padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px"><b style="font-size:16px;font-weight:700;line-height:24px">${esc(it.q || '')}</b><span style="font-size:20px;color:#666;flex-shrink:0">+</span></div><div style="padding:0 20px 16px"><p style="font-size:14px;line-height:20px;color:#444;margin:0">${esc(it.a || '')}</p></div></div>`).join('');
        html += `<div style="font-family:'DM Sans',system-ui,sans-serif;background:#FFECCC;padding:64px 48px"><div style="max-width:700px;margin:0 auto;text-align:center;display:flex;flex-direction:column;gap:16px"><h2 style="font-family:'Fraunces',serif;font-weight:600;font-size:44px;line-height:1.15;margin:0">${esc(fa.heading || 'FAQs')}</h2><p style="font-size:16px;line-height:24px;margin:0">${esc(fa.text || '')}</p></div><div style="max-width:700px;margin:36px auto 0;display:flex;flex-direction:column;gap:12px">${faqItems}</div></div>`;

        const mailSvg = '<svg width="28" height="28" viewBox="0 0 32 32" fill="none" style="flex-shrink:0"><path d="M4.74 5.63H27.26c.48 0 .89.17 1.25.53.36.36.53.77.53 1.25v17.19c0 .47-.17.88-.53 1.24-.36.36-.77.53-1.25.53H4.74c-.42 0-.78-.13-1.11-.4l-.14-.13c-.36-.36-.53-.77-.53-1.24V7.41c0-.48.17-.89.53-1.25l.14-.13c.33-.27.69-.4 1.11-.4z" stroke="#000" stroke-width="1.5" fill="none"/></svg>';
        const phoneSvg = '<svg width="28" height="28" viewBox="0 0 32 32" fill="none" style="flex-shrink:0"><path d="M5.49 4.29h4.67c.28 0 .5.09.67.25.19.18.34.43.42.77l.89 4.03c.05.33.04.59-.01.81-.05.21-.15.38-.3.53l-3.37 3.32-.28.27.2.34c.57.95 1.17 1.84 1.8 2.67.64.83 1.35 1.62 2.13 2.37.81.84 1.66 1.6 2.55 2.29.89.68 1.82 1.29 2.8 1.8l.33.17.26-.27 3.21-3.29c.2-.22.42-.36.66-.43.24-.05.49-.04.78.02l3.77.84c.32.09.57.25.75.47.18.22.27.47.27.76v4.55c0 .36-.11.63-.34.85-.23.23-.5.34-.86.34-2.53-.01-5.11-.61-7.76-1.84-2.64-1.23-5.1-2.98-7.37-5.25a30.4 30.4 0 01-4.91-6.13l-.23-.5-.22-.49C4.03 10.27 3.5 7.86 3.5 5.49c0-.31.09-.56.26-.77l.08-.08c.22-.23.49-.34.86-.34z" stroke="#000" stroke-width="1.5" fill="none"/></svg>';
        const mapSvg = '<svg width="28" height="28" viewBox="0 0 32 32" fill="none" style="flex-shrink:0"><path d="M16 2.96c2.74 0 5.15.96 7.25 2.89 2.07 1.9 3.12 4.46 3.12 7.72 0 1.34-.3 2.68-.9 4.01-.6 1.36-1.37 2.66-2.29 3.91-.93 1.25-1.93 2.42-3.02 3.51-1.1 1.1-2.12 2.07-3.07 2.92-.14.13-.3.23-.49.29-.21.07-.41.08-.6 0a1.5 1.5 0 01-.49-.29c-.95-.85-1.97-1.82-3.07-2.92-1.09-1.09-2.09-2.26-3.02-3.51-.92-1.25-1.69-2.55-2.29-3.91-.6-1.33-.9-2.67-.9-4.01 0-3.26 1.05-5.82 3.12-7.72C10.85 3.92 13.26 2.96 16 2.96z" stroke="#000" stroke-width="1.5" fill="none"/></svg>';
        const coSvgs = [mailSvg, phoneSvg, mapSvg];
        const coItemsHtml = coItems.map((it, i) => `<div style="display:flex;gap:16px;align-items:flex-start">${coSvgs[i] || mapSvg}<div><h3 style="font-size:16px;font-weight:700;line-height:24px;margin:0">${esc(it.heading || '')}</h3><p style="font-size:14px;line-height:20px;margin:0 0 4px">${esc(it.text || '')}</p><a href="${esc(it.link || '#')}" style="font-size:14px;color:#005B4A;font-weight:500;text-decoration:underline">${esc(it.link_text || '')}</a></div></div>`).join('');
        html += `<div style="font-family:'DM Sans',system-ui,sans-serif;background:#FFECCC;padding:64px 48px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;max-width:1200px;margin:0 auto"><div style="display:flex;flex-direction:column;gap:12px"><div style="font-family:'Great Vibes',cursive;font-size:20px;color:#005B4A">${esc(co.tagline || 'Visit Us')}</div><h2 style="font-family:'Fraunces',serif;font-weight:600;font-size:44px;line-height:1.15;margin:0">${esc(co.heading || 'Contact us')}</h2><p style="font-size:16px;line-height:24px;margin:0">${esc(co.text || '')}</p><div style="display:flex;flex-direction:column;gap:20px;margin-top:8px">${coItemsHtml}</div></div><img src="${esc(co.image || '/shots/figma-3.png')}" style="height:480px;border-radius:32px;width:100%;object-fit:cover" loading="lazy"></div></div>`;

        const ctaBtnsHtml = (ct.buttons || [{label:'Book a Table',href:'#book'},{label:'See the menu',href:'#menu'}]).map((b) => `<a href="${esc(b.href || '#')}" style="background:#D99E4F;color:#000;border-radius:6px;padding:8px 16px;font-weight:500;font-size:14px;display:inline-block">${esc(b.label)}</a>`).join('');
        html += `<div style="font-family:'DM Sans',system-ui,sans-serif;background:#FFECCC;padding:0 48px 64px"><div style="background:#0A1C11;border-radius:32px;padding:48px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center"><h2 style="font-family:'Fraunces',serif;font-weight:600;font-size:44px;line-height:1.15;color:#fff;margin:0">${esc(ct.heading || 'See you at the counter')}</h2><p style="font-size:16px;line-height:24px;color:#ccc;margin:0">${esc(ct.text || '')}</p><div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">${ctaBtnsHtml}</div></div></div>`;

        html += `<div style="font-family:'DM Sans',system-ui,sans-serif;background:#0A1C11;color:#fff;padding:48px 48px 24px"><div style="display:grid;grid-template-columns:1.5fr 320px;gap:40px;max-width:1200px;margin:0 auto"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:32px"><div style="font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:#fff">${navLogo}</div><div style="display:flex;flex-direction:column;gap:8px"><h4 style="font-size:14px;font-weight:700;margin:0 0 8px">Join our newsletter</h4><a href="#" style="font-size:13px;color:#aaa">Our story</a><a href="#" style="font-size:13px;color:#aaa">Menu</a><a href="#" style="font-size:13px;color:#aaa">Reservations</a></div><div style="display:flex;flex-direction:column;gap:8px"><h4 style="font-size:14px;font-weight:700;margin:0 0 8px">Visit us</h4><a href="#" style="font-size:13px;color:#aaa">Find us</a><a href="#" style="font-size:13px;color:#aaa">Careers</a><a href="#" style="font-size:13px;color:#aaa">Press</a></div><div style="display:flex;flex-direction:column;gap:8px"><h4 style="font-size:14px;font-weight:700;margin:0 0 8px">Our menu</h4><a href="#" style="font-size:13px;color:#aaa">Coffee</a><a href="#" style="font-size:13px;color:#aaa">Pastries</a><a href="#" style="font-size:13px;color:#aaa">Breakfast</a></div></div><div style="display:flex;flex-direction:column;gap:12px"><h4 style="font-size:16px;font-weight:700;margin:0">${esc(ft.newsletter_heading || 'Get in touch')}</h4><p style="font-size:14px;color:#aaa;margin:0;line-height:20px">${esc(ft.newsletter_text || '')}</p><div style="display:flex;gap:8px;align-items:center"><div style="flex:1;border-bottom:1px solid #555;padding:6px 0;font-size:14px;color:#888">${esc(ft.placeholder || 'Enter your email')}</div><button style="background:#D99E4F;color:#fff;border-radius:6px;padding:6px 12px;font-weight:500;font-size:13px;border:none">${esc(ft.button || 'Subscribe')}</button></div><p style="font-size:11px;color:#888;margin:0">${esc(ft.fineprint || '')}</p></div></div><div style="border-top:1px solid #333;margin-top:24px;padding-top:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:13px;color:#888"><span>© 2024 Hearth & Honey. All rights reserved.</span><div style="display:flex;gap:16px"><a href="#" style="color:#aaa">Privacy</a><a href="#" style="color:#aaa">Terms</a></div></div></div>`;

        return h("div", { dangerouslySetInnerHTML: { __html: html } });
      } catch(e) {
        return h("div", { style: "padding:24px;color:red;font-family:monospace" }, "Preview error: " + e.message);
      }
    });

    // --- Pages (additional markdown pages) ---
    CMS.registerPreviewTemplate("pages", ({ entry }) => {
      try {
        const d = D(entry);
        const html = `<div style="font-family:'DM Sans',system-ui,sans-serif;background:#FFECCC;padding:24px"><div style="background:linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,.4)),url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80') center/cover;color:#fff;border-radius:24px;padding:32px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end"><h1 style="font-family:'Fraunces',serif;font-size:28px;margin:0">${esc(d.title || 'New Page')}</h1><p style="font-size:14px;margin:8px 0 0">${esc(d.description || '')}</p></div><div style="background:#fff;border:2px solid #000;border-radius:16px;padding:20px;margin-top:16px"><p style="color:#666">${esc(d.body || 'No body yet — add markdown.')}</p></div><div style="font-size:11px;color:#666;text-align:center;margin-top:12px">Save, Workflow, Publish to go live.</div></div>`;
        return h("div", { dangerouslySetInnerHTML: { __html: html } });
      } catch(e) {
        return h("div", { style: "padding:24px;color:red;font-family:monospace" }, "Preview error: " + e.message);
      }
    });

    // --- Site Settings (file collection: general.yaml) ---
    CMS.registerPreviewTemplate("general", ({ entry }) => {
      try {
        const d = D(entry);
        const html = `<div style="font-family:'DM Sans',system-ui,sans-serif;background:#FFECCC;padding:24px"><div style="background:linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,.4)),url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80') center/cover;color:#fff;border-radius:24px;padding:32px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end"><h1 style="font-family:'Fraunces',serif;font-size:28px;margin:0">${esc(d.site_title || 'Hearth & Honey')}</h1><p style="font-size:14px;margin:8px 0 0">${esc(d.tagline || 'Warm mornings, soft light')}</p></div><div style="background:#fff;border:2px solid #000;border-radius:16px;padding:20px;margin-top:16px"><h2 style="font-family:'Fraunces',serif;font-size:22px;margin:0 0 8px">Site Settings</h2><p>Edit site title and tagline here.</p></div></div>`;
        return h("div", { dangerouslySetInnerHTML: { __html: html } });
      } catch(e) {
        return h("div", { style: "padding:24px;color:red;font-family:monospace" }, "Preview error: " + e.message);
      }
    });

    // --- Work card preview ---
    CMS.registerPreviewTemplate("work", ({ entry }) => {
      try {
        const d = D(entry);
        const img = d.image ? `<img src="${esc(d.image)}" style="width:100%;display:block">` : '';
        const html = `<div style="font-family:'DM Sans',system-ui,sans-serif;padding:24px"><div style="border:2px solid #0A0A0A;max-width:600px;border-radius:12px;overflow:hidden"><div style="border-bottom:2px solid #0A0A0A;padding:8px 12px;font-size:12px;font-weight:700">${esc(d.title || 'Preview')}</div>${img}<div style="padding:16px"><h3>${esc(d.title || '')}</h3><p style="color:#555;font-size:14px">${esc(d.excerpt || '')}</p><div style="margin-top:12px;font-weight:800">Enquire →</div></div></div></div>`;
        return h("div", { dangerouslySetInnerHTML: { __html: html } });
      } catch(e) {
        return h("div", { style: "padding:24px;color:red;font-family:monospace" }, "Preview error: " + e.message);
      }
    });
    </script>
